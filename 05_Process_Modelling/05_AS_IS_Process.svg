<svg xmlns="http://www.w3.org/2000/svg" width="1690" height="2010" viewBox="0 0 1690 2010"><defs><filter id="shadow" x="-15%" y="-15%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#6785A1" flood-opacity=".13"/></filter><marker id="arrowblue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#267DDA"/></marker><marker id="arrowred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#B64C51"/></marker><marker id="arrowgreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#16846D"/></marker></defs><rect x="0" y="0" width="1690" height="2010" fill="#FFFFFF"/><rect x="0" y="0" width="1690" height="165" fill="#132E48"/><text x="75" y="69" font-family="Arial,sans-serif" font-weight="700" font-size="39" fill="white">AS-IS  |  Current Procurement Process</text><text x="76" y="117" font-family="Arial,sans-serif" font-size="20" fill="#C7DCEC">Manual handoffs  /  Case-study baseline</text><rect x="160" y="255" width="279" height="1665" rx="12" fill="#EFF6FF" stroke="#DFE7EF"/><rect x="170" y="268" width="259" height="55" rx="8" fill="#2761A2"/><text x="299.5" y="302" fill="white" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial">Requester</text><rect x="443" y="255" width="279" height="1665" rx="12" fill="#F6F8FB" stroke="#DFE7EF"/><rect x="453" y="268" width="259" height="55" rx="8" fill="#46546D"/><text x="582.5" y="302" fill="white" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial">Department Manager</text><rect x="726" y="255" width="279" height="1665" rx="12" fill="#F4F0FF" stroke="#DFE7EF"/><rect x="736" y="268" width="259" height="55" rx="8" fill="#6A43B7"/><text x="865.5" y="302" fill="white" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial">Procurement</text><rect x="1009" y="255" width="279" height="1665" rx="12" fill="#F0FAF6" stroke="#DFE7EF"/><rect x="1019" y="268" width="259" height="55" rx="8" fill="#137C63"/><text x="1148.5" y="302" fill="white" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial">Vendor / Receiving</text><rect x="1292" y="255" width="279" height="1665" rx="12" fill="#FFF7EC" stroke="#DFE7EF"/><rect x="1302" y="268" width="259" height="55" rx="8" fill="#946320"/><text x="1431.5" y="302" fill="white" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial">Finance</text><text x="75" y="192" fill="#BE5D2C" font-size="17" font-family="Arial" font-weight="600">CASE-STUDY ASSUMPTION  •  Current-state process has not been observed or validated.</text><text x="75" y="1950" fill="#597085" font-size="17" font-family="Arial" font-weight="600">Key weaknesses to investigate: unclear ownership  •  duplicate entry  •  limited status visibility  •  manual invoice follow-up</text><polyline points="302.0,390.0 301.5,445.0" fill="none" stroke="#267DDA" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrowblue)"/><polyline points="301.5,533.0 584.5,565.0" fill="none" stroke="#267DDA" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrowblue)"/><polyline points="584.5,653.0 585.0,720.0" fill="none" stroke="#267DDA" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrowblue)"/><polyline points="500.0,779.0 301.5,920.0" fill="none" stroke="#B64C51" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrowred)"/><rect x="322.8" y="819.5" width="156" height="25" rx="8" fill="white" fill-opacity=".96"/><text x="400.8" y="837.5" fill="#B64C51" font-size="16" font-weight="bold" font-family="Arial" text-anchor="middle">No / missing info</text><polyline points="670.0,779.0 584.5,920.0" fill="none" stroke="#16846D" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrowgreen)"/><rect x="549.2" y="819.5" width="156" height="25" rx="8" fill="white" fill-opacity=".96"/><text x="627.2" y="837.5" fill="#16846D" font-size="16" font-weight="bold" font-family="Arial" text-anchor="middle">Yes</text><polyline points="584.5,1008.0 867.5,1080.0" fill="none" stroke="#267DDA" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrowblue)"/><polyline points="867.5,1168.0 867.5,1240.0" fill="none" stroke="#267DDA" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrowblue)"/><polyline points="867.5,1328.0 1150.5,1395.0" fill="none" stroke="#267DDA" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrowblue)"/><polyline points="1150.5,1483.0 1433.5,1550.0" fill="none" stroke="#267DDA" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrowblue)"/><polyline points="1433.5,1642.0 1433.5,1713.0" fill="none" stroke="#267DDA" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrowblue)"/><g><ellipse cx="302.0" cy="365.0" rx="44.0" ry="25.0" fill="#DBEFE7" stroke="#16846D" stroke-width="2.5"/></g><text x="302.0" y="371.0" font-family="Arial" font-weight="600" font-size="17" text-anchor="middle" fill="#142D45">Start</text><g><rect x="194" y="445" width="215" height="88" rx="13" fill="#FFFFFF" stroke="#9BB5C9" stroke-width="2"/></g><text x="301.5" y="485.0" font-family="Arial" font-weight="600" font-size="17" text-anchor="middle" fill="#142D45">Write request and send</text><text x="301.5" y="505.0" font-family="Arial" font-weight="600" font-size="17" text-anchor="middle" fill="#142D45">email / attachment</text><g><rect x="477" y="565" width="215" height="88" rx="13" fill="#FFFFFF" stroke="#9BB5C9" stroke-width="2"/></g><text x="584.5" y="605.0" font-family="Arial" font-weight="600" font-size="17" text-anchor="middle" fill="#142D45">Review email and</text><text x="584.5" y="625.0" font-family="Arial" font-weight="600" font-size="17" text-anchor="middle" fill="#142D45">request details</text><g><path d="M585.0 720 L670 779.0 L585.0 838 L500 779.0Z" fill="#FFF1D8" stroke="#C58C33" stroke-width="2.5"/></g><text x="585.0" y="775.0" font-family="Arial" font-weight="600" font-size="15" text-anchor="middle" fill="#142D45">Complete and</text><text x="585.0" y="795.0" font-family="Arial" font-weight="600" font-size="15" text-anchor="middle" fill="#142D45">approved?</text><g><rect x="194" y="920" width="215" height="88" rx="13" fill="#FFF0EC" stroke="#C65B4D" stroke-width="2"/></g><text x="301.5" y="960.0" font-family="Arial" font-weight="600" font-size="17" text-anchor="middle" fill="#142D45">Clarification or</text><text x="301.5" y="980.0" font-family="Arial" font-weight="600" font-size="17" text-anchor="middle" fill="#142D45">rejection by email</text><g><rect x="477" y="920" width="215" height="88" rx="13" fill="#FFFFFF" stroke="#9BB5C9" stroke-width="2"/></g><text x="584.5" y="960.0" font-family="Arial" font-weight="600" font-size="17" text-anchor="middle" fill="#142D45">Approval sent via</text><text x="584.5" y="980.0" font-family="Arial" font-weight="600" font-size="17" text-anchor="middle" fill="#142D45">email; manually tracked</text><g><rect x="760" y="1080" width="215" height="88" rx="13" fill="#FFFFFF" stroke="#9BB5C9" stroke-width="2"/></g><text x="867.5" y="1120.0" font-family="Arial" font-weight="600" font-size="17" text-anchor="middle" fill="#142D45">Re-enter data in</text><text x="867.5" y="1140.0" font-family="Arial" font-weight="600" font-size="17" text-anchor="middle" fill="#142D45">procurement spreadsheet</text><g><rect x="760" y="1240" width="215" height="88" rx="13" fill="#FFFFFF" stroke="#9BB5C9" stroke-width="2"/></g><text x="867.5" y="1280.0" font-family="Arial" font-weight="600" font-size="17" text-anchor="middle" fill="#142D45">Create and email</text><text x="867.5" y="1300.0" font-family="Arial" font-weight="600" font-size="17" text-anchor="middle" fill="#142D45">purchase order (PO)</text><g><rect x="1043" y="1395" width="215" height="88" rx="13" fill="#FFFFFF" stroke="#9BB5C9" stroke-width="2"/></g><text x="1150.5" y="1435.0" font-family="Arial" font-weight="600" font-size="17" text-anchor="middle" fill="#142D45">Supplier delivers;</text><text x="1150.5" y="1455.0" font-family="Arial" font-weight="600" font-size="17" text-anchor="middle" fill="#142D45">receipt confirmation</text><g><rect x="1326" y="1550" width="215" height="92" rx="13" fill="#FFFFFF" stroke="#9BB5C9" stroke-width="2"/></g><text x="1433.5" y="1592.0" font-family="Arial" font-weight="600" font-size="17" text-anchor="middle" fill="#142D45">Compare PO, goods receipt</text><text x="1433.5" y="1612.0" font-family="Arial" font-weight="600" font-size="17" text-anchor="middle" fill="#142D45">and invoice manually</text><g><rect x="1326" y="1713" width="215" height="76" rx="13" fill="#FFFFFF" stroke="#9BB5C9" stroke-width="2"/></g><text x="1433.5" y="1747.0" font-family="Arial" font-weight="600" font-size="17" text-anchor="middle" fill="#142D45">Close / follow up</text><text x="1433.5" y="1767.0" font-family="Arial" font-weight="600" font-size="17" text-anchor="middle" fill="#142D45">by email</text></svg>